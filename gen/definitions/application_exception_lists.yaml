# Manual data source: the schema and fromBody() are generated, Read() is hand-written
# -> Read(): every page of GET /policies/v2/exceptionApplicationLists (`page` and `limit=1000`), the ids are put into a body as `ids` before fromBody().
#    An error is reported when `meta.total` is missing or changes between the pages, when the ids read are not `meta.total`, when a page is empty before the total is reached, repeats the page before or holds more than `limit` ids, when `meta.total` is more than 1000 pages of 1000 ids, when an id is not a number or when an id is listed twice.
# The list holds the ids of the exception application lists that the Do Not Decrypt lists of the organization use (the `exceptionapplicationlistId` of the Do Not Decrypt lists), the draft of the API says: unique, ordered by id, deleted lists excluded.
# APIBEHAVIOUR: the answer is {status, meta{page, limit, total}, data: [ids]}. Without `limit` `meta.limit` is 100 (a page of 100 ids was not seen, the cut at 100 was seen on the applications of a list), `limit` accepts up to 1000 (1001 is a 400), `limit` 0, -1, abc and `page` 0 are a 400, a page past the end is a 200 with an empty `data`.
# APIBEHAVIOUR: in lowercase (/policies/v2/exceptionapplicationlists) the route is a 404 "no Route matched" of the gateway (seen on this route only).
# APIBEHAVIOUR: the ids of the list were the same as the ids that the Do Not Decrypt lists carry in `exceptionapplicationlistId` (with 1 and with 2 lists). With 2 ids they were ascending, `limit=1` returned the first id on `page=1` and the second on `page=2`, and `offset` was read as the index of a page here too.
# APIBEHAVIOUR: after the 2 Do Not Decrypt lists that used the 2 exception lists were deleted, the answer was empty (`meta.total` 0). The draft has only GET routes for the exception lists, so an exception list was only ever deleted together with its Do Not Decrypt list, and whether the answer would list a deleted exception list on its own was not seen.
# Observed on the int environment with 1 and with 2 lists. NOT observed: more than 2 ids, a page of 100 or more ids. The paging of the applications of a list was observed with 125 items and is assumed to be the same here.
---
name: Application Exception Lists
rest_endpoint: /policies/v2/exceptionApplicationLists
doc_category: Resources
no_resource: true
no_import: true
no_id: true
ds_description: >-
  This data source reads the ids of the exception application lists that the Do Not Decrypt lists of the organization use. A Do Not Decrypt list that has
  applications uses one, the API returns its id as `exceptionapplicationlistId` of that Do Not Decrypt list. Use the `secureaccess_application_exception_list`
  data source to read a list.
attributes:
  - model_name: ids
    type: Set
    element_type: Int64
    description: Ids of the exception application lists that Do Not Decrypt lists use.
    example: 16708649
