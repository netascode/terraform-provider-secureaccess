# Manual resource
# Get return list of rules, with no details, so Data source need to read by ID
# adjustBody sends empty file type (group) sets as [] instead of null, as null is ignored by PATCH
# ValidateConfig requires all file_size_* with RANGE and none with ALL
# adjustRead reads file_size_* as null with ALL, as CSA returns its defaults then
---
name: DLP AI Guardrails Rule
rest_endpoint: /policies/v2/dlp/aiGuardrails/rules
adjust_body: true
adjust_read: true
patch_update_merge: true
doc_category: Secure
attributes:
  - model_name: name
    type: String
    mandatory: true
    description: Name of the DLP AI Guardrails Rule.
    example: my_dlp_ai_guardrails_rule
    data_source_query: true
  - model_name: description
    empty_as_null: true
    type: String
    description: Description of the rule.
    example: My AI Guardrails rule
  - model_name: severity
    type: String
    description: Severity of the rule.
    mandatory: true
    example: CRITICAL
    enum_values: ["CRITICAL", "ALERT", "WARNING", "INFO"]
  # - model_name: type
  #   type: String
  #   description: Description of the DLP Real Time Rule.
  #   example: My real time rule.
  - model_name: enabled
    type: Bool
    mandatory: true
    description: Whether the rule is enabled.
    example: true

  # Data Classification
  - model_name: scannableContexts
    tf_name: data_classification_scannable_contexts
    type: Set
    element_type: String
    mandatory: true
    description: Select where to search for the selected data classifications.
    example: "CONTENT"
    enum_values: ["CONTENT", "FILENAME"]
  - model_name: classifications
    tf_name: data_classifications
    mandatory: true
    type: Set
    description: Classifications to scan using OR boolean logic.
    attributes:
      - model_name: id
        id: true
        mandatory: true
        type: String
        description: ID of the classification.
        example: d309239a-b6fd-11ef-a825-0242ac120002
        test_value: data.secureaccess_dlp_builtin_classification.test.id
      - model_name: name
        type: String
        description: Name of the classification.
        example: Privacy Guardrail
        test_value: data.secureaccess_dlp_builtin_classification.test.name
        minimum_test_value: data.secureaccess_dlp_builtin_classification.test.name
  
  # Files Control
  - model_name: mipTags
    empty_as_null: true
    tf_name: file_labels
    type: Set
    element_type: String
    description: Up to 10 labels that this rule will search for when inspecting document properties. Applicable only when `unclassified_files_scan` is not set to `true`.
    example: "Confidential"
    max_list: 10
  - model_name: fileSizeConfigType
    default_value: ALL
    tf_name: file_size_configuration_type
    type: String
    description: Configuration type for file size control. With `RANGE`, all `file_size_*` attributes are required. With `ALL`, none of them can be set.
    example: "RANGE"
    enum_values: ["ALL", "RANGE"]
  - model_name: fileSizeFrom
    patch_merge_no_clear: true
    tf_name: file_size_from
    type: Int64
    description: Minimum file size for file control. Required with `file_size_configuration_type` `RANGE`.
    example: 1024
  - model_name: fileSizeFromUnit
    patch_merge_no_clear: true
    tf_name: file_size_from_unit
    type: String
    description: Unit of the minimum file size for file control. Required with `file_size_configuration_type` `RANGE`.
    example: "KB"
    enum_values: ["KB", "MB"]
  - model_name: fileSizeTo
    patch_merge_no_clear: true
    tf_name: file_size_to
    type: Int64
    description: Maximum file size for file control. Required with `file_size_configuration_type` `RANGE`.
    example: 10240
  - model_name: fileSizeToUnit
    patch_merge_no_clear: true
    tf_name: file_size_to_unit
    type: String
    description: Unit of the maximum file size for file control. Required with `file_size_configuration_type` `RANGE`.
    example: "KB"
    enum_values: ["KB", "MB"]
  - model_name: fileTypesIncluded
    empty_as_null: true
    tf_name: file_types_included
    type: Set
    description: File types included for file control.
    attributes:
      - model_name: id
        id: true
        mandatory: true
        type: Int64
        description: ID of the file type.
        example: 250
        test_value: data.secureaccess_dlp_file_types.all.items["cdr"].id
      - model_name: name
        type: String
        description: Name of the file type.
        example: cdr
  - model_name: fileTypeGroupsIncluded
    empty_as_null: true
    tf_name: file_type_groups_included
    type: Set
    description: File type groups included for file control.
    attributes:
      - model_name: id
        id: true
        mandatory: true
        type: Int64
        description: ID of the file type group.
        example: 6
        test_value: data.secureaccess_dlp_file_type_groups.all.items["Documents"].id
      - model_name: name
        type: String
        description: Name of the file type group.
        example: Documents
        exclude_test: true
  - model_name: fileTypesExcluded
    empty_as_null: true
    tf_name: file_types_excluded
    type: Set
    description: File types excluded from file control.
    attributes:
      - model_name: id
        id: true
        mandatory: true
        type: Int64
        description: ID of the file type.
        example: 156
        test_value: data.secureaccess_dlp_file_types.all.items["dbf"].id
      - model_name: name
        type: String
        description: Name of the file type.
        example: dbf
  - model_name: fileTypeGroupsExcluded
    empty_as_null: true
    tf_name: file_type_groups_excluded
    type: Set
    description: File type groups excluded from file control.
    attributes:
      - model_name: id
        id: true
        mandatory: true
        type: Int64
        description: ID of the file type group.
        example: 2
        test_value: data.secureaccess_dlp_file_type_groups.all.items["Compressed files"].id
      - model_name: name
        type: String
        description: Name of the file type group.
        example: Compressed files
  - model_name: detectUnclassifiedFiles
    default_value: false
    tf_name: unclassified_files_scan
    type: Bool
    description: Scan and log files with no labels. Applicable only when `file_labels` is unset.
    example: false
  
  # Identities
  - model_name: identities
    tf_name: identities_included
    type: Set
    mandatory: true
    description: Identities included for scanning. Use `type_id` to specify whole types of identities (i.a. Network Tunnel Groups). Add `id` to specify individual identities within `type_id`.
    attributes:
      - model_name: originId
        empty_as_null: true
        tf_name: id
        type: Int64
        description: ID of the identity.
        example: 1442790899
        exclude_test: true
      - model_name: originTypeId
        tf_name: type_id
        mandatory: true
        id: true
        type: Int64
        description: Type ID of the identity.
        example: 7
  - model_name: excludedIdentities
    empty_as_null: true
    tf_name: identities_excluded
    type: Set
    description: Identities excluded from scanning. Use `type_id` to specify whole types of identities (i.a. Network Tunnel Groups). Add `id` to specify individual identities within `type_id`.
    attributes:
      - model_name: originId
        empty_as_null: true
        tf_name: id
        type: Int64
        description: ID of the identity.
        exclude_example: true
        exclude_test: true
      - model_name: originTypeId
        tf_name: type_id
        mandatory: true
        id: true
        type: Int64
        description: Type ID of the identity.
        example: 40
  
  # Destinations
  - model_name: applications
    empty_as_null: true
    tf_name: applications_included
    type: Set
    description: Applications included for scanning.
    exclude_example: true
    exclude_test: true
    attributes:
      - model_name: id
        tf_name: id
        type: Int64
        mandatory: true
        description: ID of the application.
      - model_name: trafficDirection
        tf_name: traffic_direction
        type: String
        mandatory: true
        description: Traffic direction of the application.
        enum_values: ["REQUEST", "RESPONSE", "BOTH"]
  - model_name: applicationCategories
    empty_as_null: true
    tf_name: application_categories_included
    type: Set
    description: Application categories included for scanning.
    exclude_example: true
    exclude_test: true
    attributes:
      - model_name: id
        tf_name: id
        type: Int64
        mandatory: true
        description: ID of the application category.
      - model_name: trafficDirection
        tf_name: traffic_direction
        mandatory: true
        type: String
        description: Traffic direction of the application.
        enum_values: ["REQUEST", "RESPONSE", "BOTH"]

  # Action
  - model_name: action
    type: String
    mandatory: true
    description: Action associated with the rule.
    example: BLOCK
    enum_values: ["BLOCK", "MONITOR"]
  - model_name: overrideBlock
    default_value: false
    type: Bool
    description: Allow override with business justification. Requires `notification_popup` to be set to `true`.
    example: false

  # User Notifications
  - model_name: popupNotification
    empty_as_null: true
    tf_name: notification_popup
    type: Bool
    description: Sends endpoint notifications to the user's machine.
    example: true
  - model_name: edlpNotificationTemplateId
    patch_merge_no_clear: true
    empty_as_null: true
    tf_name: notification_template_id
    type: String
    description: ID of the notification template for custom notifications.
    exclude_example: true
    exclude_test: true
  - model_name: notifyActor
    empty_as_null: true
    tf_name: email_notify_actor
    type: Bool
    description: Sends email notifications to the actor.
    example: true
  - model_name: notifyManager
    empty_as_null: true
    tf_name: email_notify_actors_manager
    type: Bool
    description: Sends email notifications to the actors' manager.
    example: true
  - model_name: customEmailsNotification
    empty_as_null: true
    tf_name: email_notify_custom_recipients
    type: Set
    element_type: String
    description: Sends email notifications to custom email addresses.
    example: user1@example.com
    exclude_test: true # This is failing on PATCH
  # notificationTemplateUuid conditionally added in model_secureaccess_dlp_ai_guardrails_rule.go
  - model_name: notificationTemplateUuid
    patch_merge_no_clear: true
    empty_as_null: true
    tf_name: email_notification_template_id
    type: String
    description: UUID of the notification template.
    example: 00000000-0000-0000-0000-000000000000
    exclude_example: true
    exclude_test: true

test_prerequisites: |-
  data "secureaccess_dlp_builtin_classification" "test" {
    name = "Privacy Guardrail"
  }
  data "secureaccess_dlp_file_types" "all" {}
  data "secureaccess_dlp_file_type_groups" "all" {}
