# Manual resource
# APIBEHAVIOUR: mappings are changed with PATCH add/remove operations, there is no POST/PUT/DELETE
# -> Create() / Update() (GET all current mappings and revision, PATCH add/remove operations to match the plan, see setMappings())
#    API rejects adding an already mapped or removing a not mapped trusted network (400), the whole PATCH is then rejected
# -> Delete() (PATCH remove operations for the trusted networks in state, with the revision from state)
# -> Read() (GetAll for the items, `rev` is read separately from a single page, as GetAll does not return it)
# -> ImportState() (import ID is the profile ID)
---
name: ZTA Profile Private Access Trusted Network Mappings
rest_endpoint: /deployments/v2/ztna/profiles/%v/privateSteering/trustedNetworkMappings
doc_category: Connect
no_data_source: true
skip_minimum_test: true
attributes:
  - model_name: profileId
    tf_name: zta_profile_id
    type: String
    reference: true
    description: ID of the ZTNA Profile.
    example: acde070d-8c4c-4f0d-9d8a-162843c10333
    test_value: secureaccess_zta_profile.test.id
  - model_name: rev
    tf_name: revision
    type: Int64
    computed: true
    description: Revision of the private access trusted network mappings, incremented on each change.
  - model_name: items
    tf_name: trusted_networks
    type: Set
    description: List of trusted networks mapped to the ZTNA Profile for private access steering.
    mandatory: true
    attributes:
      - model_name: id
        type: String
        description: ID of the trusted network.
        example: acde070d-8c4c-4f0d-9d8a-162843c10333
        test_value: secureaccess_zta_trusted_network.test.id

test_prerequisites: |-
  resource "secureaccess_zta_profile" "test" {
    name     = "my ztna profile private trusted network mappings"
    priority = 1
  }

  resource "secureaccess_zta_trusted_network" "test" {
    name = "my ztna profile private trusted network mappings"
    dns_servers = [
      {
        ip = "1.1.1.1"
      }
    ]
  }
