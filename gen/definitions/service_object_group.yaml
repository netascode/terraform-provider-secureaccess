# Manual resource
# -> adjustBody() APIBEHAVIOUR: Service Object & Service Object Group req & resp JSON do not match
# -> ConfigValidators() (At least one of `service_objects`, `service_object_groups`, `literals` needs to be specified)
---
name: Service Object Group
rest_endpoint: /policies/v2/objects/serviceObjectGroups
adjust_body: true
doc_category: Resources
delay_on_delete: 4
attributes:
  - model_name: name
    type: String
    mandatory: true
    description: Name of the Service Object Group.
    example: my_service_object_group
    data_source_query: true
  - model_name: description
    type: String
    description: Description of the Service Object Group.
    example: This is my service object group.
  - model_name: groups
    tf_name: service_object_groups
    type: List
    description: Service Object Groups to be included in this Service Object Group.
    attributes:
      - model_name: id
        type: Int64
        description: ID of the Service Object Group.
        example: 123456
        test_value: secureaccess_service_object_group.test_prereq.id
        id: true
      - model_name: name
        type: String
        description: Name of the Service Object Group.
        computed: true
        computed_refresh_value: true
  - model_name: objects
    tf_name: service_objects
    type: List
    description: Service Objects to be included in this Service Object Group.
    attributes:
      - model_name: id
        type: Int64
        description: ID of the Service Object.
        example: 123456
        test_value: secureaccess_service_object.test.id
        id: true
      - model_name: name
        type: String
        description: Name of the Service Object.
        computed: true
        computed_refresh_value: true
  - model_name: values
    tf_name: literals
    type: List
    description: Literal (non-reusable) values of the Service Objects.
    minimum_test_value: "'true'"
    attributes:
    - model_name: protocol
      type: String
      mandatory: true
      enum_values: ["tcp", "udp", "icmp", "any"]
      lowercase_response: true
      description: Protocol of the Service Object.
      example: tcp
      minimum_test_value: '"udp"'
    - model_name: ports
      type: List
      element_type: String
      description: List of ports or port ranges of the Service Object.
      example: "8443"
      minimum_test_value: '["53"]'

test_prerequisites: |-
  resource "secureaccess_service_object" test {
    name     = "my_service_object_group"
    protocol = "tcp"
    ports    = ["8080"]
  }

  resource "secureaccess_service_object_group" test_prereq {
    name = "my_service_object_group_prereq"
    literals = [
      {
        protocol = "tcp"
        ports    = ["9090"]
      }
    ]
  }
