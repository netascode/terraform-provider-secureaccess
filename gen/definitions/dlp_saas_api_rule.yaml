# Manual resource
# Get return list of rules, with no details, so Data source need to read by ID
# adjustBody sends empty file type (group) sets as [] instead of null, as null is ignored by PATCH
# ValidateConfig requires all file_size_* with RANGE and none with ALL
# adjustRead reads file_size_* as null with ALL, as CSA returns its defaults then
# Tests need an existing SaaS API platform instance, set $TF_VAR_saas_api_platform_id
# adjustBody adds the default notification template with email_notify_actor or email_notify_owner, as the API requires one
---
name: DLP SaaS API Rule
rest_endpoint: /policies/v2/dlp/saasApi/rules
adjust_body: true
adjust_read: true
patch_update_merge: true
test_tags: ["TF_VAR_saas_api_platform_id"]
doc_category: Secure
attributes:
  - model_name: name
    type: String
    mandatory: true
    description: Name of the DLP SaaS API Rule.
    example: my_saas_api_rule
    data_source_query: true
  - model_name: description
    empty_as_null: true
    type: String
    description: Description of the rule.
    example: My SaaS API rule
  - model_name: severity
    type: String
    description: Severity of the rule.
    mandatory: true
    example: CRITICAL
    enum_values: ["CRITICAL", "ALERT", "WARNING", "INFO"]
  # - model_name: type
  #   type: String
  #   description: Description of the DLP SaaS API Rule.
  #   example: My SaaS API rule.
  - model_name: enabled
    type: Bool
    mandatory: true
    description: Whether the rule is enabled.
    example: true

  # Data Classification
  - model_name: scannableContexts
    tf_name: data_classification_scannable_contexts
    type: Set
    element_type: String
    mandatory: true
    description: Select where to search for the selected data classifications.
    example: "CONTENT"
    enum_values: ["CONTENT", "FILENAME"]
  - model_name: classifications
    tf_name: data_classifications
    mandatory: true
    type: Set
    description: Classifications to scan using OR boolean logic.
    attributes:
      - model_name: id
        id: true
        mandatory: true
        type: String
        description: ID of the classification.
        example: 39b3b945-2e21-4831-bbbc-86fc5200ddf7
        test_value: data.secureaccess_dlp_builtin_classification.test.id
      - model_name: name
        type: String
        description: Name of the classification.
        example: Built-in PCI Classification
        test_value: data.secureaccess_dlp_builtin_classification.test.name
        minimum_test_value: data.secureaccess_dlp_builtin_classification.test.name
  
  # Platform
  - model_name: name
    data_path: ["incrementalConfig", "platforms.0"]
    tf_name: platform_name
    mandatory: true
    type: String
    description: Name of the platform.
    example: spark
  - model_name: id
    data_path: ["incrementalConfig", "platforms.0", "instances.0"]
    tf_name: platform_id
    type: Int64
    mandatory: true
    description: ID of the platform instance.
    example: 12345
    test_value: var.saas_api_platform_id
    minimum_test_value: var.saas_api_platform_id
  - model_name: applicationLabels
    data_path: ["incrementalConfig", "platforms.0", "instances.0"]
    tf_name: platform_application_labels
    type: Set
    mandatory: true
    element_type: String
    description: Application labels for the platform instance.
    example: spark

  # Files Control
  - model_name: mipTags
    empty_as_null: true
    tf_name: file_mip_and_titus_labels
    type: Set
    element_type: String
    description: Up to 10 labels that this rule will search for when inspecting document properties. Applicable only when `unclassified_files_scan` is not set to `true`.
    example: "Confidential"
    max_list: 10
  - model_name: fileSizeConfigType
    default_value: ALL
    tf_name: file_size_configuration_type
    type: String
    description: Configuration type for file size control. With `RANGE`, all `file_size_*` attributes are required. With `ALL`, none of them can be set.
    example: "RANGE"
    enum_values: ["ALL", "RANGE"]
  - model_name: fileSizeFrom
    patch_merge_no_clear: true
    tf_name: file_size_from
    type: Int64
    description: Minimum file size for file control. Required with `file_size_configuration_type` `RANGE`.
    example: 1024
  - model_name: fileSizeFromUnit
    patch_merge_no_clear: true
    tf_name: file_size_from_unit
    type: String
    description: Unit of the minimum file size for file control. Required with `file_size_configuration_type` `RANGE`.
    example: "KB"
    enum_values: ["KB", "MB"]
  - model_name: fileSizeTo
    patch_merge_no_clear: true
    tf_name: file_size_to
    type: Int64
    description: Maximum file size for file control. Required with `file_size_configuration_type` `RANGE`.
    example: 10240
  - model_name: fileSizeToUnit
    patch_merge_no_clear: true
    tf_name: file_size_to_unit
    type: String
    description: Unit of the maximum file size for file control. Required with `file_size_configuration_type` `RANGE`.
    example: "KB"
    enum_values: ["KB", "MB"]
  - model_name: fileTypesIncluded
    empty_as_null: true
    tf_name: file_types_included
    type: Set
    description: File types included for file control.
    attributes:
      - model_name: id
        id: true
        mandatory: true
        type: Int64
        description: ID of the file type.
        example: 250
      - model_name: name
        type: String
        description: Name of the file type.
        example: cdr
  - model_name: fileTypeGroupsIncluded
    empty_as_null: true
    tf_name: file_type_groups_included
    type: Set
    description: File type groups included for file control.
    attributes:
      - model_name: id
        id: true
        mandatory: true
        type: Int64
        description: ID of the file type group.
        example: 6
      - model_name: name
        type: String
        description: Name of the file type group.
        example: Documents
        exclude_test: true
  - model_name: fileTypesExcluded
    empty_as_null: true
    tf_name: file_types_excluded
    type: Set
    description: File types excluded from file control.
    attributes:
      - model_name: id
        id: true
        mandatory: true
        type: Int64
        description: ID of the file type.
        example: 156
      - model_name: name
        type: String
        description: Name of the file type.
        example: dbf
  - model_name: fileTypeGroupsExcluded
    empty_as_null: true
    tf_name: file_type_groups_excluded
    type: Set
    description: File type groups excluded from file control.
    attributes:
      - model_name: id
        id: true
        mandatory: true
        type: Int64
        description: ID of the file type group.
        example: 2
      - model_name: name
        type: String
        description: Name of the file type group.
        example: Compressed files
  - model_name: detectUnclassifiedFiles
    default_value: false
    tf_name: unclassified_files_scan
    type: Bool
    description: Scan and log files with no labels. Applicable only when `file_mip_and_titus_labels` is unset.
    example: false
  
  # Identities
  - model_name: identities
    exclude_test: true # API rejects whole identity types (originTypeId only) with 400
    empty_as_null: true
    tf_name: identities_included
    type: Set
    description: Identities included for scanning. Use `type_id` to specify whole types of identities (i.a. AD Groups). Add `id` to specify individual identities within `type_id`.
    attributes:
      - model_name: originId
        empty_as_null: true
        tf_name: id
        type: Int64
        description: ID of the identity.
        example: 1442790899
        exclude_test: true
      - model_name: originTypeId
        tf_name: type_id
        mandatory: true
        id: true
        type: Int64
        description: Type ID of the identity.
        example: 7
  - model_name: excludedIdentities
    exclude_test: true # API rejects whole identity types (originTypeId only) with 400
    empty_as_null: true
    tf_name: identities_excluded
    type: Set
    description: Identities excluded from scanning. Use `type_id` to specify whole types of identities (i.a. AD Groups). Add `id` to specify individual identities within `type_id`.
    attributes:
      - model_name: originId
        empty_as_null: true
        tf_name: id
        type: Int64
        description: ID of the identity.
        exclude_example: true
        exclude_test: true
      - model_name: originTypeId
        tf_name: type_id
        mandatory: true
        id: true
        type: Int64
        description: Type ID of the identity.
        example: 40
  - model_name: domains
    empty_as_null: true
    data_path: ["incrementalConfig"]
    tf_name: user_domain_destinations
    type: Set
    element_type: String
    description: Manually add user domain destinations.
    example: example.com
  - model_name: owners
    empty_as_null: true
    data_path: ["incrementalConfig"]
    tf_name: file_owner_email_addresses
    type: Set
    element_type: String
    description: Manually add user email addresses.
    example: owner@example.com

  # Resources
  # TBD

  # Exposure
  - model_name: exposure
    empty_as_null: true
    tf_name: exposures_included
    data_path: ["incrementalConfig", "exposures.0"]
    type: List
    description: Select which file sharing exposure to consider in addition to this rule's other settings.
    attributes:
      - model_name: type
        type: String
        mandatory: true
        enum_values: ["EXTERNAL", "INTERNAL", "SPECIFIC", "PUBLIC", "DOMAIN"]
        description: Type of exposure.
        example: INTERNAL
      - model_name: users
        empty_as_null: true
        exclude_test: true
        type: Set
        element_type: String
        description: Specific users to consider for this exposure.
      - model_name: domains
        empty_as_null: true
        exclude_test: true
        type: Set
        element_type: String
        description: Specific domains to consider for this exposure.

  # Action
  - model_name: action
    type: String
    mandatory: true
    description: Action associated with the rule.
    example: MONITOR
    enum_values: ["DELETE", "MONITOR"]

  # User Notifications
  - model_name: notifyOwner
    empty_as_null: true
    tf_name: email_notify_owner
    type: Bool
    description: Sends email notifications to the owner.
    example: true
  - model_name: notifyActor
    empty_as_null: true
    tf_name: email_notify_actor
    type: Bool
    description: Sends email notifications to the actor.
    example: true
  - model_name: notifyManager
    empty_as_null: true
    tf_name: email_notify_actors_manager
    type: Bool
    description: Sends email notifications to the actors' manager.
    example: true
  - model_name: customEmailsNotification
    empty_as_null: true
    tf_name: email_notify_custom_recipients
    type: Set
    element_type: String
    description: Sends email notifications to custom email addresses.
    example: user1@example.com
    exclude_test: true # This is failing on PATCH
  # notificationTemplateUuid conditionally added in model_secureaccess_dlp_saas_api_rule.go
  - model_name: notificationTemplateUuid
    patch_merge_no_clear: true
    empty_as_null: true
    tf_name: email_notification_template_id
    type: String
    description: UUID of the notification template.
    example: 00000000-0000-0000-0000-000000000000
    exclude_example: true
    exclude_test: true

test_prerequisites: |-
  variable "saas_api_platform_id" { default = null } // tests will set $TF_VAR_saas_api_platform_id

  data "secureaccess_dlp_builtin_classification" "test" {
    name = "Built-in PCI Classification"
  }