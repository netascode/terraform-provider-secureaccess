# APIBEHAVIOUR: cursor/limit pagination, needs CursorLimitKeyedPagination for /deployments/v2/ztna/ in go-secureaccess
# -> adjustBody() (`rev` from state is sent in the PUT body, API rejects updates with a stale revision with 409)
# Mutex for ZTA profile modifications
# -> Create() (name `Default ZTA Profile` uses the fixed ID `default-profile`, reads the current revision, and updates it with PUT instead of POST)
# -> ValidateConfig() (operating systems and network locations of the default profile cannot be changed)
# -> Delete() (the default profile cannot be deleted, it is reset with PUT of the required fields only, see toBodyPutDelete())
# Priority of the ZTA profile does not have to be continous and will work
#  correctly updates position, but at creation does not guarantee order
#  after creation the priority numbers are contiguous
---
name: ZTA Profile
rest_endpoint: /deployments/v2/ztna/profiles
doc_category: Connect
adjust_body: true
resource_id_model_name: profileId
res_description: This resource manages ZTA Profile. The order of created profiles is determined by order they are created by Terraform and `priority`, hence they may not be created in the order `priority` suggests. Subsequent update will fix ordering.
attributes:
  - model_name: profileName
    tf_name: name
    type: String
    mandatory: true
    description: Name of the ZTA Profile. Must be unique within the organization. Must be alphanumeric or space. The name `Default ZTA Profile` manages the existing default profile, which is updated instead of created, and reset instead of deleted.
    string_patterns: ["^[a-zA-Z0-9 ]+$"]
    string_max_length: 64
    example: my ztna profile
    data_source_query: true
  - model_name: rev
    tf_name: revision
    type: Int64
    computed: true
    description: Revision of the configuration.
  - model_name: priority
    type: Int64
    mandatory: true
    description: Priority of the ZTA Profile. Profiles should have contiguous priority values starting from 1. The default profile, named `Default ZTA Profile`, always has priority `0`.
    example: 1

  # Sources - Operating Systems
  - model_name: enabled
    data_path: ["operatingSystems", "mac-intel"]
    tf_name: operating_system_macos
    type: Bool
    description: Whether the ZTA Profile is enabled for macOS clients.
    default_value: true
    example: true
  - model_name: enabled
    data_path: ["operatingSystems", "win"]
    tf_name: operating_system_windows
    type: Bool
    description: Whether the ZTA Profile is enabled for Windows clients.
    default_value: true
    example: true
  - model_name: enabled
    data_path: ["operatingSystems", "linux-64"]
    tf_name: operating_system_linux
    type: Bool
    description: Whether the ZTA Profile is enabled for Linux clients.
    default_value: true
    example: false
  - model_name: enabled
    data_path: ["operatingSystems", "apple-ios"]
    tf_name: operating_system_ios
    type: Bool
    description: Whether the ZTA Profile is enabled for iOS clients.
    default_value: true
    example: true
  - model_name: enabled
    data_path: ["operatingSystems", "android", "generic-android"]
    tf_name: operating_system_android
    type: Bool
    description: Whether the ZTA Profile is enabled for generic Android clients.
    default_value: true
    example: true
  - model_name: enabled
    data_path: ["operatingSystems", "android", "knox-android"]
    tf_name: operating_system_android_knox
    type: Bool
    description: Whether the ZTA Profile is enabled for Samsung Knox Android clients.
    default_value: true
    example: false

  # Sources - Users and Groups
  - model_name: allUsersEnabled
    data_path: ["usersData"]
    tf_name: all_users
    type: Bool
    description: Whether the ZTA Profile is enabled for all users of the organization.
    example: true
  - model_name: allGroupsEnabled
    data_path: ["groupsData"]
    tf_name: all_groups
    type: Bool
    description: Whether the ZTA Profile is enabled for all groups of the organization.
    example: true

  # Sources - Network Locations
  - model_name: networkLocationIds
    tf_name: network_location_ids
    type: Set
    element_type: String
    description: Network Locations associated with the ZTA Profile.
    max_list: 50
    example: 8f0831d9-02e2-4c2d-9f71-47874e9465f7
    #test_value: "[secureaccess_zta_network_location.test.id]"
    exclude_test: true

  # Secure Private Access - DNS Steering
  - model_name: dnsSteeringDestinations
    data_path: ["securePrivateAccess"]
    tf_name: private_access_dns_steering_destinations
    type: Set
    description: DNS steering destinations for secure private access.
    max_list: 20
    exclude_example: true
    exclude_test: true
    attributes:
      - model_name: id
        type: String
        id: true
        mandatory: true
        description: ID of the DNS steering destination.
        example: acde070d-8c4c-4f0d-9d8a-162843c10333

  # Secure Private Access - Options
  - model_name: trustedNetworksEnabled
    data_path: ["securePrivateAccess"]
    tf_name: private_access_use_trusted_networks
    type: Bool
    description: Whether Trusted Network Detection is enabled for secure private access.
    example: true
  - model_name: enabled
    data_path: ["securePrivateAccess", "enforcementPause"]
    tf_name: private_access_end_user_pause
    type: Bool
    description: Whether ZTA enforcement pause is enabled for secure private access.
    example: true
  - model_name: durationMinutes
    data_path: ["securePrivateAccess", "enforcementPause"]
    tf_name: private_access_end_user_pause_duration
    type: Int64
    description: Enforcement pause duration in minutes for secure private access. When not set while the pause is enabled, the pause is indefinite.
    min_int: 1
    max_int: 1440
    example: 30

  # Secure Internet Access - Traffic Steering
  - model_name: steeringMode
    data_path: ["secureInternetAccess"]
    tf_name: internet_access_steering_mode
    type: Int64
    description: "Internet steering mode: `0` - no internet destinations, `1` - all internet destinations, `2` - selected internet destinations."
    min_int: 0
    max_int: 2
    example: 1

  # Secure Internet Access - Options
  - model_name: trustedNetworksEnabled
    data_path: ["secureInternetAccess"]
    tf_name: internet_access_use_trusted_networks
    type: Bool
    description: Whether Trusted Network Detection is enabled for secure internet access.
    example: true
  - model_name: enabled
    data_path: ["secureInternetAccess", "enforcementPause"]
    tf_name: internet_access_end_user_pause
    type: Bool
    description: Whether ZTA enforcement pause is enabled for secure internet access.
    example: true
  - model_name: durationMinutes
    data_path: ["secureInternetAccess", "enforcementPause"]
    tf_name: internet_access_end_user_pause_duration
    type: Int64
    description: Enforcement pause duration in minutes for secure internet access. When not set while the pause is enabled, the pause is indefinite.
    min_int: 1
    max_int: 1440
    example: 60

  # - model_name: enabled
  #   data_path: ["aiGateway"]
  #   tf_name: ai_gateway_enabled
  #   type: Bool
  #   description: Whether AI Gateway support is enabled for the ZTA Profile.
  #   example: false

