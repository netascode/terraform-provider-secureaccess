# Manual data source
# Read() - single Get() instead of GetAll(), items read from `fileTypes`
#        - warns about names in `items` not found, as fromBody() drops them silently
# APIBEHAVIOUR: no pagination, single request returns all File Types and File Type Groups
---
name: DLP File Types
rest_endpoint: /policies/v2/dlp/fileTypes
doc_category: Secure
no_resource: true
no_import: true
no_id: true
is_bulk: true
ds_description: >-
  This resource reads DLP File Types.\n
  If `items` is empty, all DLP File Types are returned, otherwise only the listed ones.\n
attributes:
  - tf_name: items
    type: Map
    description: >-
      Map of DLP File Types. The key of the map is the name of the individual DLP File Type.
    map_key_example: zip
    attributes:
      - model_name: id
        type: Int64
        resource_id: true
        description: Id of the DLP File Type.
        exclude_example: true
        exclude_test: true
      - model_name: mimeType
        type: String
        description: MIME type.
        computed: true
      - model_name: extension
        type: String
        description: File extension.
        computed: true
      - model_name: groupId
        tf_name: file_type_group_id
        type: Int64
        description: Id of the DLP File Type Group the DLP File Type belongs to.
        computed: true
