---
name: DLP AI Guardrails Data Identifiers
rest_endpoint: /policies/v2/dlp/aiGuardrails/dataIdentifiers
doc_category: Secure
no_resource: true
no_import: true
no_id: true
is_bulk: true
ds_description: >-
  This resource reads DLP AI Guardrails Data Identifiers.\n
  If `items` is empty, all DLP AI Guardrails Data Identifiers are returned, otherwise only the listed ones.\n
attributes:
  - tf_name: items
    type: Map
    description: >-
      Map of DLP AI Guardrails Data Identifiers. The key of the map is the name of the individual DLP AI Guardrails Data Identifier.
    map_key_example: Email Address
    attributes:
      - model_name: id
        type: String
        resource_id: true
        description: Id of the DLP AI Guardrails Data Identifier.
        exclude_example: true
        exclude_test: true
