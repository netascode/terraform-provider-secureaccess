# Manual data source
# !!!!!!!!!!!!!!!!!!
# !!!!! Schema() - `items` is a map(map(object)) keyed by identity type and name, not generated by the template !!!!!
# !!!!!!!!!!!!!!!!!!
# Read() - own offset/limit pagination with single Get() calls instead of GetAll(), items read from `data`
#        - `filter` sent as `search` query parameter instead of client-side filtering
#        - `identity_types` sent as comma separated `identitytypes` query parameter,
#          types listed in `items` are sent instead when `identity_types` is not set
# Manual model
# imports - explicit `diag` import, goimports resolves it to a wrong package
# types - `Items` is types.Map of map[type]map[name]IdentitiesItems, no `type` attribute on items
# fromBody() - items grouped by `type.type`, keyed by `label`, duplicate names within a type raise a warning
#            - deleted identities (`deleted` true or `(deleted)` in the name) skipped unless `include_deleted` is true
#            - `include_deleted` defaults to false only when not configured
# APIBEHAVIOUR: offset/limit pagination without count, `limit` (max 5000) must always be set
# APIBEHAVIOUR: no API parameter for deleted identities, filtered on `deleted` field and `(deleted)` in the name
# APIBEHAVIOUR: some deleted identities have `deleted` false, only the name is suffixed with `(deleted)`
# APIBEHAVIOUR: identity names are unique only within a type
---
name: Identities
rest_endpoint: /reports/v2/identities
doc_category: Resources
no_resource: true
no_import: true
no_id: true
is_bulk: true
ds_description: >-
  This is Early Access and may be subject to changes.
  This resource reads Identities, grouped by identity type.\n
  If `items` is empty, all Identities are returned, otherwise only the listed types (and names).\n
  If `filter` is provided, only Identities matching the filter are returned.
attributes:
  - model_name: filter
    tf_only: true
    type: String
    data_source_optional_parameter: true
    description: Case-insensitive substring used to filter identities by name.
    exclude_example: true
    exclude_test: true
  - model_name: include_deleted
    tf_only: true
    type: Bool
    data_source_optional_parameter: true
    description: Specifies whether to include deleted identities, i.e. marked as deleted or with `(deleted)` in the name.
    exclude_example: true
    exclude_test: true
    default_value: false
  - model_name: identitytypes
    tf_name: identity_types
    tf_only: true
    type: List
    element_type: String
    data_source_optional_parameter: true
    description: List of identity types to include.
    enum_values:
      - "ad_connector"
      - "android"
      - "anyconnect"
      - "app_connector_agent"
      - "bdr"
      - "branch"
      - "chromebook_user"
      - "connected_devices"
      - "device"
      - "directory_computer"
      - "directory_domain"
      - "directory_group"
      - "directory_user"
      - "domain_controller"
      - "edlp_client"
      - "gsuite_domain"
      - "gsuite_group"
      - "gsuite_user"
      - "internal_network"
      - "meraki_auto_vpn"
      - "mobile_device"
      - "network"
      - "network_device"
      - "network_dns_forwarder"
      - "network_tunnel_hub"
      - "on_network"
      - "policy"
      - "roaming"
      - "saml_group"
      - "saml_user"
      - "secure_web_appliance"
      - "sgt_id"
      - "site"
      - "tunnel_device"
      - "vpn"
      - "vpn_id"
      - "ztna_client"
      - "-ad_connector"
      - "-android"
      - "-anyconnect"
      - "-app_connector_agent"
      - "-bdr"
      - "-branch"
      - "-chromebook_user"
      - "-connected_devices"
      - "-device"
      - "-directory_computer"
      - "-directory_domain"
      - "-directory_group"
      - "-directory_user"
      - "-domain_controller"
      - "-edlp_client"
      - "-gsuite_domain"
      - "-gsuite_group"
      - "-gsuite_user"
      - "-internal_network"
      - "-meraki_auto_vpn"
      - "-mobile_device"
      - "-network"
      - "-network_device"
      - "-network_dns_forwarder"
      - "-network_tunnel_hub"
      - "-on_network"
      - "-policy"
      - "-roaming"
      - "-saml_group"
      - "-saml_user"
      - "-secure_web_appliance"
      - "-sgt_id"
      - "-site"
      - "-tunnel_device"
      - "-vpn"
      - "-vpn_id"
      - "-ztna_client"
    exclude_example: true
    exclude_test: true
  - tf_name: items
    type: Map
    description: >-
      Map of Identities grouped by type. The key of the outer map is the identity type, the key of the inner map is the name of the individual Identity.
    map_key_example: site
    attributes:
      - model_name: id
        type: String
        resource_id: true
        description: Id of the Identity.
        exclude_example: true
        exclude_test: true
      - model_name: deleted
        type: Bool
        description: Deletion status of the Identity.
        exclude_example: true
