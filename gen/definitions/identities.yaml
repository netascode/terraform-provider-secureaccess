# Manual data source
# Read() - own offset/limit pagination with single Get() calls instead of GetAll(), items read from `data`
#        - `search` sent as `search` query parameter
#        - deleted identities (`deleted` true or `(deleted)` in the name) skipped unless `include_deleted` is true
#        - duplicate names (case-insensitive) raise a warning, first identity is kept
#        - warns about names in `items` not found, as fromBody() drops them silently
# `identity_type` is a `reference` sent as `identitytypes` query parameter of `rest_endpoint`, to make it required
# APIBEHAVIOUR: offset/limit pagination without count, `limit` (max 5000) must always be set
# APIBEHAVIOUR: no API parameter for deleted identities, filtered on `deleted` field and `(deleted)` in the name
# APIBEHAVIOUR: some deleted identities have `deleted` false, only the name is suffixed with `(deleted)`
---
name: Identities
rest_endpoint: /reports/v2/identities?identitytypes=%v
doc_category: Resources
no_resource: true
no_import: true
no_id: true
is_bulk: true
ds_description: >-
  This is Early Access and may be subject to changes.
  This resource reads Identities of a single identity type.\n
  If `items` is empty, all Identities of `identity_type` are returned, otherwise only the listed ones.\n
  If `search` is provided, only Identities matching the search string are returned.\n
attributes:
  - model_name: identitytypes
    tf_name: identity_type
    tf_only: true
    reference: true
    type: String
    data_source_optional_parameter: true
    description: Identity type to read.
    example: directory_group
    enum_values:
      - "ad_connector"
      - "android"
      - "anyconnect"
      - "app_connector_agent"
      - "bdr"
      - "branch"
      - "chromebook_user"
      - "connected_devices"
      - "device"
      - "directory_computer"
      - "directory_domain"
      - "directory_group"
      - "directory_user"
      - "domain_controller"
      - "edlp_client"
      - "gsuite_domain"
      - "gsuite_group"
      - "gsuite_user"
      - "internal_network"
      - "meraki_auto_vpn"
      - "mobile_device"
      - "network"
      - "network_device"
      - "network_dns_forwarder"
      - "network_tunnel_hub"
      - "on_network"
      - "policy"
      - "roaming"
      - "saml_group"
      - "saml_user"
      - "secure_web_appliance"
      - "sgt_id"
      - "site"
      - "tunnel_device"
      - "vpn"
      - "vpn_id"
      - "ztna_client"
  - model_name: search
    tf_only: true
    type: String
    data_source_optional_parameter: true
    description: Search string, only Identities where it appears in the Identity data are returned.
    exclude_example: true
    exclude_test: true
  - model_name: include_deleted
    tf_only: true
    type: Bool
    data_source_optional_parameter: true
    description: Specifies whether to include deleted identities, i.e. marked as deleted or with `(deleted)` in the name.
    exclude_example: true
    exclude_test: true
    default_value: false
  - tf_name: items
    type: Map
    description: >-
      Map of Identities. The key of the map is the name of the individual Identity.
    map_key_example: Finance
    map_key_model_name: label
    attributes:
      - model_name: id
        type: Int64
        resource_id: true
        description: Id of the Identity.
        exclude_example: true
        exclude_test: true
      - model_name: id
        data_path: ["type"]
        tf_name: type_id
        type: Int64
        description: Type ID of the Identity.
      - model_name: deleted
        type: Bool
        description: Deletion status of the Identity.
        exclude_example: true
