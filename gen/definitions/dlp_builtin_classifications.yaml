---
name: DLP Builtin Classifications
rest_endpoint: /policies/v2/dlp/builtIn/classifications
doc_category: Secure
no_resource: true
no_import: true
no_id: true
is_bulk: true
ds_description: >-
  This resource reads DLP Builtin Classifications.\n
  If `items` is empty, all DLP Builtin Classifications are returned, otherwise only the listed ones.\n
attributes:
  - tf_name: items
    type: Map
    description: >-
      Map of DLP Builtin Classifications. The key of the map is the name of the individual DLP Builtin Classification.
    map_key_example: Built-in PCI Classification
    attributes:
      - model_name: id
        type: String
        resource_id: true
        description: Id of the DLP Builtin Classification.
        exclude_example: true
        exclude_test: true
