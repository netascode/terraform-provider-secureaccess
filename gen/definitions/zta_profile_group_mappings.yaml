# Manual resource
# APIBEHAVIOUR: cursor/limit pagination, needs CursorLimitKeyedPagination for /deployments/v2/ztna/ in go-secureaccess
# APIBEHAVIOUR: mappings are changed with PATCH add/remove operations, there is no POST/PUT/DELETE
# -> Create() / Update() (GET all current mappings and revision, PATCH add/remove operations to match the plan, see setMappings())
#    API rejects adding an already mapped or removing a not mapped group (400), the whole PATCH is then rejected
# -> Delete() (PATCH remove operations for the groups in state, with the revision from state)
# -> Read() (GetAll for the items, `rev` is read separately from a single page, as GetAll does not return it)
# -> ImportState() (import ID is the profile ID)
---
name: ZTA Profile Group Mappings
rest_endpoint: /deployments/v2/ztna/profiles/%v/groupMappings
doc_category: Connect
no_data_source: true
skip_minimum_test: true
test_tags: ["TF_VAR_ad_group_id"]
attributes:
  - model_name: profileId
    tf_name: zta_profile_id
    type: String
    reference: true
    id: true
    description: ID of the ZTA Profile.
    example: acde070d-8c4c-4f0d-9d8a-162843c10333
    test_value: secureaccess_zta_profile.test.id
  - model_name: rev
    tf_name: revision
    type: Int64
    computed: true
    description: Revision of the configuration.
  - model_name: items
    tf_name: groups
    type: Set
    description: List of groups mapped to the ZTA Profile.
    mandatory: true
    attributes:
      - model_name: id
        type: String
        description: ID of the group.
        id: true
        mandatory: true
        example: "12345678"
        test_value: var.ad_group_id

test_prerequisites: |-
  variable "ad_group_id" { default = null } // tests will set $TF_VAR_ad_group_id

  resource "secureaccess_zta_profile" "test" {
    name     = "my ztna profile group mappings"
    priority = 1
  }
