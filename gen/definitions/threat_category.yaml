# Data source only: a Threat Category is found by its `id` or by its `name`
# Manual model
# -> adjustRead() - reads the five options that the API does not return as fields from `categoryBits`: Potentially Harmful Domains, Newly Seen Domains,
#                   Dynamic DNS, DNS Tunneling VPN and Cryptomining (the `model_name` of these attributes is made up, they are `tf_only`)
# APIBEHAVIOUR: the route is case sensitive, `/policies/v2/threatCategories` answers 200 and the lowercase spelling answers 404
# APIBEHAVIOUR: the list ignores `page` and `limit`, GET by id also returns `categories` (a lookup by `name` uses the list item, which has no `categories`)
# APIBEHAVIOUR: `categoryBits` is a hexadecimal string, bit N is `1 << N` of the whole number, the bit numbers are the ones of the Web UI and every other bit is ignored
# Only the name and the options of the Web UI are exposed. Not exposed: `bundleTypeId`, `isDefault`, `isSwgDefault`, `superMalware`, `superBotnet` (the Web UI sets both from the options Malware and Command and Control Callbacks),
#              `suspiciousResponseFiltering`, `ampScan`, `fileInspection`, `ipFiltering`, `malwareUrlProxy`, `urlProxyHttps`, `categories`, `categoryBits`, `organizationId`, `createdAt`, `modifiedAt` and `markedForDeletion`
---
name: Threat Category
rest_endpoint: /policies/v2/threatCategories
doc_category: Secure
no_resource: true
no_import: true
adjust_read: true
ds_description: This data source reads a Threat Category, found by its `id` or by its `name`.
attributes:
  - model_name: name
    type: String
    description: Name of the Threat Category.
    data_source_query: true
    example: My Threat Category
  - model_name: malwareProtection
    tf_name: malware
    type: Bool
    description: Specifies whether Malware is enabled (Web UI Threat Categories, Malware).
    example: true
  - model_name: botnetProtection
    tf_name: command_and_control_callbacks
    type: Bool
    description: Specifies whether Command and Control Callbacks are enabled (Web UI Threat Categories, Command and Control Callbacks).
    example: true
  - model_name: phishingProtection
    tf_name: phishing_attacks
    type: Bool
    description: Specifies whether Phishing Attacks are enabled (Web UI Threat Categories, Phishing Attacks).
    example: true
  - model_name: potentiallyHarmfulDomains
    type: Bool
    tf_only: true
    description: Specifies whether Potentially Harmful Domains are enabled (Web UI Threat Categories, Potentially Harmful Domains).
    example: false
  - model_name: newlySeenDomains
    type: Bool
    tf_only: true
    description: Specifies whether Newly Seen Domains are enabled (Web UI Threat Categories, Newly Seen Domains).
    example: false
  - model_name: dynamicDns
    type: Bool
    tf_only: true
    description: Specifies whether Dynamic DNS is enabled (Web UI Threat Categories, Dynamic DNS).
    example: false
  - model_name: dnsTunnelingVpn
    type: Bool
    tf_only: true
    description: Specifies whether DNS Tunneling VPN is enabled (Web UI Threat Categories, DNS Tunneling VPN).
    example: false
  - model_name: cryptomining
    type: Bool
    tf_only: true
    description: Specifies whether Cryptomining is enabled (Web UI Threat Categories, Cryptomining).
    example: false
